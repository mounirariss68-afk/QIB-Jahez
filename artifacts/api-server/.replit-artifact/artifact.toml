kind = "api"
previewPath = "/"
title = "Jahiz"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 5000
name = "API Server"
paths = ["/"]

[services.development]
run = "cd ../.. && bash tools/replit-run.sh"

[services.production]

[services.production.build]
args = ["bash", "-c", "npm install --include=dev --no-audit --no-fund && npm run build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["npm", "start"]

[services.production.run.env]
PORT = "5000"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
