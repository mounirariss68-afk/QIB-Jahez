<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jahiz · One Click readiness · QIB (demo)</title>
    <meta name="description" content="Jahiz: the agentic readiness and remediation layer for QIB's One Click Finance pre-approval. Demo prototype on synthetic data." />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <script>
      (function () {
        try {
          var m = localStorage.getItem("atelier-theme") || "system";
          var d = m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", d);
          document.documentElement.style.colorScheme = d ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
